name: "法律文书统一格式"
description: "律所统一版式：标题宋体加粗 / 正文仿宋14pt / 固定行距24磅 / 首行2字符 / 西文数字 Times New Roman。与 cn-firm-documents 统一规格一致（单一权威源见 cn-firm-documents/references/unified-format-spec.md）"

# 页面设置（统一规格：上3.7 下3.5 左2.8 右2.6 cm）
# paper：a4（PRC/HK 默认）/ letter（US·CA）。法域自动选择规则 + 误判安全门见
# unified-format-spec.md §纸张法域规则——调用层据 matter.yaml 法域覆盖本键，
# md2word 本体不读 matter.yaml。显式 width/height 不再设（由 paper 驱动）。
page:
  paper: a4
  margin_top: 3.7
  margin_bottom: 3.5
  margin_left: 2.8
  margin_right: 2.6

# 字体设置（正文：仿宋14pt；西文/阿拉伯数字统一 Times New Roman）
fonts:
  default:
    name: "仿宋"
    name_alt: "仿宋"
    ascii: "Times New Roman"
    size: 14      # pt
    color: "#000000"

# 标题设置（标题宋体加粗；西文 Times New Roman）
titles:
  # 文章标题：16pt 宋体加粗 居中 段前6/段后6
  level1:
    size: 16
    bold: true
    align: "center"
    font: "宋体"
    font_alt: "Times New Roman"
    space_before: 6
    space_after: 6
    indent: 0
  # 正文内标题（level2/3/4 全级同规格）：14pt 宋体加粗 左对齐 段前6/段后0
  level2:
    size: 14
    bold: true
    align: "left"
    font: "宋体"
    font_alt: "Times New Roman"
    space_before: 6
    space_after: 0
    indent: 0
  level3:
    size: 14
    bold: true
    align: "left"
    font: "宋体"
    font_alt: "Times New Roman"
    space_before: 6
    space_after: 0
    indent: 0
  level4:
    size: 14
    bold: true
    align: "left"
    font: "宋体"
    font_alt: "Times New Roman"
    space_before: 6
    space_after: 0
    indent: 0

# 段落设置（正文：两端对齐 / 段前0段后0 / 固定行距24磅 / 首行缩进2字符）
paragraph:
  line_spacing_rule: exact   # 固定值（非倍数）
  line_spacing_pt: 24        # 固定行距 24 磅（标题段与正文段同享）
  line_spacing: 1.5          # 回退值（仅当 line_spacing_rule≠exact 时生效）
  first_line_indent_chars: 2 # 首行缩进 2 字符（× 正文字号，随字号走）
  align: "justify"
  space_before: 0
  space_after: 0

# 页码设置（第 X 页 共 Y 页 / 居中 / 五号 / 汉字宋体 / 数字 Times New Roman）
page_number:
  enabled: true
  format: "第 {PAGE} 页 共 {TOTAL} 页"
  font: "宋体"
  ascii: "Times New Roman"
  size: 10.5    # pt (五号)
  position: "center"

# 引号设置
quotes:
  convert_to_chinese: true

# 表格设置（非统一规格项，保留既有）
table:
  border_enabled: true
  border_color: "#000000"
  border_width: 4
  line_spacing: 1.2
  row_height_cm: 0.8
  alignment: "center"
  cell_margin:
    top: 30
    bottom: 30
    left: 60
    right: 60
  vertical_align: "center"
  header:
    font: "Times New Roman"
    size: 10.5
    bold: true
    color: "#000000"
  body:
    font: "仿宋"
    font_alt: "仿宋"
    size: 10.5
    color: "#000000"

# 代码块设置（非统一规格项，保留既有；律所文书一般无代码块）
code_block:
  label:
    font: "Times New Roman"
    size: 10
    color: "#808080"
  content:
    font: "Times New Roman"
    size: 10
    color: "#333333"
    left_indent: 24
    line_spacing: 1.2

# 行内代码设置
inline_code:
  font: "Times New Roman"
  size: 10
  color: "#333333"

# 引用块设置
quote:
  background_color: "#EAEAEA"
  left_indent_inches: 0.2
  font_size: 9
  line_spacing: 1.5

# 数学公式设置
math:
  font: "Times New Roman"
  size: 11
  italic: true
  color: "#00008B"

# 图片设置
image:
  display_ratio: 0.92
  max_width_cm: 14.2
  target_dpi: 260
  show_caption: true

# 分割线设置
horizontal_rule:
  character: "─"
  repeat_count: 55
  font: "Times New Roman"
  size: 12
  color: "#808080"
  alignment: "center"

# 列表设置
lists:
  bullet:
    marker: "•"
    indent: 24
  numbered:
    indent: 24
    preserve_format: true
  task:
    unchecked: "☐"
    checked: "☑"
